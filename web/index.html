<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AVA Zona — фойдаланувчи иловаси (такси, нон, бошқа хизматлар)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AVA Zona">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AVA Zona</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Дастлабки юклаш экранидaги loading спиннер */
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #loader-wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #14532D 0%, #0E7A38 55%, #2E9E57 100%);
      color: white;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    #loader-wrap.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-wrap h1 { font-size: 20px; margin: 16px 0 4px; font-weight: 700; }
    #loader-wrap p  { font-size: 13px; opacity: 0.7; margin: 0; }
  </style>
</head>
<body>
  <div id="loader-wrap">
    <div class="spinner"></div>
    <h1>🚖 AVA Zona</h1>
    <p>Илова юкланмоқда...</p>
  </div>
  <script>
    function hideLoader() {
      var el = document.getElementById('loader-wrap');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 600);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    // Some Flutter web builds/browsers may miss the event; do not keep the
    // splash overlay above an already-mounted Flutter view forever.
    window.addEventListener('load', function () {
      setTimeout(hideLoader, 8000);
    });
  </script>
  <script>
    (function () {
      var resetKey = 'mtg_sw_cache_reset_v3';
      if (!('serviceWorker' in navigator) || sessionStorage.getItem(resetKey)) {
        return;
      }
      sessionStorage.setItem(resetKey, '1');
      Promise.all([
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
          .catch(function () {}),
        window.caches
          ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          : Promise.resolve()
      ]).then(function () {
        // If an old Flutter service worker served the wrong bundle (admin on `/`),
        // reload once so the page is fetched directly from Hosting.
        window.location.reload();
      });
    })();
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA90OclnNKts45eIqB5S524OibPT73fwfQ&libraries=places"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
