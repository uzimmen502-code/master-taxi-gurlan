name: ava_gurlan
description: "AVA Zona - 5 modulli mobil ilova"
publish_to: 'none'
version: 1.0.26+64

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  firebase_app_installations: ^0.3.1
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  firebase_crashlytics: ^4.3.5
  cloud_functions: ^5.1.3

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # Location & Maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  google_maps_flutter_android: ^2.12.0
  google_maps_flutter_ios: ^2.12.0

  # Network & Utils
  http: ^1.2.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.3
  image_picker: ^1.0.0
  flutter_image_compress: ^2.3.0
  uuid: ^4.5.1
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2

  # Video (Android → ExoPlayer)
  video_player: ^2.9.2
  chewie: ^1.8.5

  # State management
  provider: ^6.1.2

  # Charts & analytics
  fl_chart: ^0.69.0
  intl: ^0.20.2
  device_info_plus: ^12.4.0
  share_plus: ^10.1.4
  pdf: ^3.11.3
  flutter_ringtone_player: ^4.0.0
  audioplayers: ^6.1.0
  graphview: ^1.5.1
  timezone: ^0.9.4
  crypto: ^3.0.7
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

