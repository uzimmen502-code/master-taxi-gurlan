name: ava_gurlan
description: "AVA Zona - 5 modulli mobil ilova"
publish_to: 'none'
version: 1.0.30+68

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  firebase_app_installations: ^0.3.1
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  firebase_crashlytics: ^4.3.5
  cloud_functions: ^5.1.3

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # Location & Maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  google_maps_flutter_android: ^2.12.0
  google_maps_flutter_ios: ^2.12.0

  # Network & Utils
  http: ^1.2.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.3
  image_picker: ^1.0.0
  flutter_image_compress: ^2.3.0
  uuid: ^4.5.1
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2

  # Video (Android → ExoPlayer)
  video_player: ^2.9.2
  chewie: ^1.8.5

  # State management
  provider: ^6.1.2

  # Charts & analytics
  fl_chart: ^0.69.0
  intl: ^0.20.2
  device_info_plus: ^12.4.0
  share_plus: ^10.1.4
  pdf: ^3.11.3
  flutter_ringtone_player: ^4.0.0
  audioplayers: ^6.1.0
  graphview: ^1.5.1
  timezone: ^0.9.4
  crypto: ^3.0.7
  video_compress: ^3.1.4
  flutter_markdown_plus: ^1.0.12
  google_fonts: ^8.2.1
  markdown: ^7.3.1

# video_player_android 2.9.5 — vendored nusxa, ikkita patch:
#  1) ExoPlayer LoadControl buferi 50s → 20s (AvaLoadControl.java) —
#     TextureVideoPlayer/PlatformViewVideoPlayer'dagi `.setLoadControl(...)`.
#  2) Media3 SimpleCache + HLS segment prefetch (AvaMediaCache.java) —
#     HttpVideoAsset.getMediaSourceFactory'dagi `unstableWrapWithCache(...)`
#     (faqat http(s)); ilova tomonida MainActivity.kt `tv_media_cache` kanali.
#  3) Birinchi variant doim eng pasti (AvaBandwidthMeter.java) —
#     TextureVideoPlayer/PlatformViewVideoPlayer'dagi `.setBandwidthMeter(...)`.
# Plugin yangilanganda: pub nusxasini qayta ko'chirib, uchala patch fayl va
# ularning chaqiruv qatorlarini qaytadan qo'shish kerak.
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # TvPlayerPool testlari — VideoPlayerPlatform fake (ExoPlayer'siz).
  video_player_platform_interface: ^6.7.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

# Launcher icons already in android/ios res — do not run until app_icon.png exists.
# flutter_launcher_icons:
#   android: true
#   ios: true
#   image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lang/uz_Latn.json
    - assets/lang/uz_Cyrl.json
    - assets/lang/ru.json
    - assets/book/ava_imkoniyatlar_kitobi.json
    - assets/images/
    - assets/images/services/
    - assets/images/banners/
    - assets/bread_yupqa.png
    - assets/bread_churak.png
    - assets/bread_qovoq.png
    - assets/bread_yongok.png
    - assets/beard_zogora.png
    - assets/beard_qora.png
    - assets/beard_kunjut.png
    - assets/beard_gosht.png
    - assets/beard_toy.png
    - assets/somsa.png
    - assets/pizza.png
    - assets/xachipuri.png
    - assets/mockups/home_design.png
    - assets/sounds/marshrut_online.wav
    - assets/sounds/marshrut_offline.wav

  # Тавсифда Manrope сўралган эди, лекин унда ўзбек кириллига хос
  # Қ (U+049A), Ғ (U+0492), Ҳ (U+04B2) ҳарфлари йўқ — сўз ўртасида
  # тизим шрифтига тушиб кетарди. Тавсифдаги захира («Roboto ёки Inter»)
  # бўйича Inter олинди: Қ/Ғ/Ҳ/Ў, ʻ ва → тўлиқ қопланади.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800